server:
  port: 8080
  error:
    include-message: always

spring:
  profiles:
    active: local
  application:
    name: uniHire

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: ${POSTGRES_HOST_KEY:jdbc:postgresql://localhost:5432/unihire}
    username: ${POSTGRES_USERNAME_KEY:postgres}
    password: ${POSTGRES_PASSWORD_KEY:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST_KEY:localhost}
      port: ${REDIS_PORT_KEY:6379}
      username: ${REDIS_USERNAME_KEY:}
      password: ${REDIS_PASSWORD_KEY:}

  opensearch:
    uris: ${OPENSEARCH_URIS:https://localhost:9200}
    username: ${OPENSEARCH_USERNAME:admin}
    password: ${OPENSEARCH_PASSWORD:admin}
    sync-on-startup: ${OPENSEARCH_SYNC_ON_STARTUP:false}

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        distance-type: COSINE_DISTANCE
        dimensions: 3072
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: text-embedding-004

resume:
  ai:
    provider: gemini

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000 # 1 day in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

oauth2:
  google:
    client-id: YOUR_GOOGLE_CLIENT_ID_HERE

unihire:
  job-views:
    sync-rate-ms: ${JOB_VIEWS_SYNC_INTERVAL_MS:900000} # 15 minutes
    sync-initial-delay-ms: ${JOB_VIEWS_SYNC_INITIAL_DELAY_MS:60000} # 1 minute

---
spring:
  config:
    activate:
      on-profile: prod
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        distance-type: COSINE_DISTANCE
        dimensions: 3072

# SpringDoc / Swagger OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
