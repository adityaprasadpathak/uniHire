aws:
  s3:
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket: ${AWS_S3_BUCKET:unihire-local}

unihire:
  job-views:
    sync-rate-ms: ${JOB_VIEWS_SYNC_INTERVAL_MS:900000} # 15 minutes
    sync-initial-delay-ms: ${JOB_VIEWS_SYNC_INITIAL_DELAY_MS:60000} # 1 minute
