plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.unihire'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	// Core Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// Database (JPA + Postgres)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	
	// Redis, OpenSearch, Websockets
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.opensearch.client:opensearch-java:2.19.0'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'jakarta.json:jakarta.json-api:2.0.1'
	runtimeOnly 'org.glassfish:jakarta.json:2.0.1'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Spring AI & Vector Store
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	
	// MinIO, AWS S3 & Apache Tika
	implementation 'io.minio:minio:8.6.0'
	implementation 'software.amazon.awssdk:s3:2.25.11'
	implementation 'org.apache.tika:tika-core:3.2.2'
	implementation 'org.apache.tika:tika-parsers-standard-package:3.0.0'

	// Security & JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	implementation 'com.google.api-client:google-api-client:2.4.0'

	// Swagger / OpenAPI 3
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'

	// Spring AI BOM
	implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
